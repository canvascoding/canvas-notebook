<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:;"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canvas Notebook</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7fa;
        --panel: #ffffff;
        --text: #17202e;
        --muted: #647084;
        --line: #d8dee8;
        --accent: #1267d8;
        --accent-hover: #0f57b6;
        --danger: #b42318;
        --success: #067647;
        --warning: #9a6700;
        --surface-muted: #f2f5fa;
        --shadow: 0 18px 60px rgba(15, 23, 42, 0.14);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10141b;
          --panel: #181e27;
          --text: #eef3fb;
          --muted: #98a4b7;
          --line: #303948;
          --accent: #5c9dff;
          --accent-hover: #7db1ff;
          --danger: #ff8a80;
          --success: #69d7a3;
          --warning: #f3c76d;
          --surface-muted: #202936;
          --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 720px;
        min-height: 560px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          linear-gradient(180deg, rgba(18, 103, 216, 0.08), transparent 34%),
          var(--bg);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 48px;
      }

      .panel {
        width: min(560px, 100%);
        border: 1px solid var(--line);
        overflow: hidden;
        border-radius: 12px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .panel-header {
        padding: 30px 32px 8px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 16px;
        height: 16px;
        border: 1px solid color-mix(in srgb, var(--accent) 65%, var(--line));
        border-radius: 5px;
        background:
          linear-gradient(135deg, transparent 44%, var(--accent) 45% 56%, transparent 57%),
          color-mix(in srgb, var(--accent) 14%, transparent);
      }

      h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 680;
        letter-spacing: 0;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      form {
        padding: 22px 32px 30px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 650;
      }

      .input-row {
        display: flex;
        gap: 10px;
      }

      input {
        width: 100%;
        min-width: 0;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        color: var(--text);
        background: transparent;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }

      button {
        height: 42px;
        flex: 0 0 auto;
        border: 0;
        border-radius: 7px;
        padding: 0 18px;
        color: white;
        background: var(--accent);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button:disabled {
        cursor: default;
        opacity: 0.65;
      }

      .status {
        display: flex;
        gap: 10px;
        min-height: 0;
        margin-top: 16px;
        padding: 12px 14px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--surface-muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .status[hidden] {
        display: none;
      }

      .status-icon {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        margin-top: 1px;
      }

      .status-copy {
        min-width: 0;
      }

      .status-title {
        display: block;
        color: var(--text);
        font-weight: 700;
      }

      .status-message {
        display: block;
        margin-top: 2px;
      }

      .status.error {
        border-color: color-mix(in srgb, var(--danger) 34%, var(--line));
        background: color-mix(in srgb, var(--danger) 9%, var(--panel));
        color: var(--danger);
      }

      .status.success {
        border-color: color-mix(in srgb, var(--success) 32%, var(--line));
        background: color-mix(in srgb, var(--success) 9%, var(--panel));
        color: var(--success);
      }

      .status.warning {
        border-color: color-mix(in srgb, var(--warning) 34%, var(--line));
        background: color-mix(in srgb, var(--warning) 9%, var(--panel));
        color: var(--warning);
      }

      .status.progress {
        color: var(--muted);
      }

      .help-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-top: 22px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: color-mix(in srgb, var(--surface-muted) 62%, var(--panel));
      }

      .help-copy {
        min-width: 0;
      }

      .help-copy strong {
        display: block;
        font-size: 13px;
      }

      .help-copy span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .website-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        color: var(--text);
        background: var(--panel);
        font-size: 12px;
        white-space: nowrap;
      }

      .website-button:hover {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, var(--panel));
      }

      .website-button svg {
        width: 14px;
        height: 14px;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        border-top: 1px solid var(--line);
        padding: 14px 32px;
        color: var(--muted);
        font-size: 12px;
      }

      code {
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      @media (max-width: 640px) {
        body {
          min-width: 0;
        }

        main {
          padding: 24px;
        }

        .input-row,
        .help-card,
        .footer {
          align-items: stretch;
          flex-direction: column;
        }

        .input-row button,
        .website-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="title">
        <div class="panel-header">
          <div class="eyebrow"><span class="brand-mark" aria-hidden="true"></span>Canvas Notebook Desktop</div>
          <h1 id="title">Connect Canvas Notebook</h1>
          <p>Enter the URL of the Canvas Notebook server this desktop app should open.</p>
        </div>

        <form id="connection-form">
          <label for="server-url">Server URL</label>
          <div class="input-row">
            <input
              id="server-url"
              name="server-url"
              type="url"
              inputmode="url"
              autocomplete="url"
              spellcheck="false"
              placeholder="https://notebook.example.com"
              required
            >
            <button id="connect-button" type="submit">Connect</button>
          </div>
          <div id="status" class="status" role="status" aria-live="polite" hidden>
            <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 8v5"></path>
              <path d="M12 16h.01"></path>
            </svg>
            <div class="status-copy">
              <strong id="status-title" class="status-title"></strong>
              <span id="status-message" class="status-message"></span>
            </div>
          </div>

          <aside class="help-card" aria-label="Canvas Notebook website">
            <div class="help-copy">
              <strong>Need a Canvas Notebook server?</strong>
              <span>Learn more about Canvas Notebook and available hosting options.</span>
            </div>
            <button id="website-button" class="website-button" type="button">
              Open canvasnotebook.app
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M7 17 17 7"></path>
                <path d="M8 7h9v9"></path>
              </svg>
            </button>
          </aside>
        </form>

        <div class="footer">
          <span id="app-version">Canvas Notebook</span>
          <span>Local development: <code>http://localhost:3000</code></span>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector('#connection-form');
      const input = document.querySelector('#server-url');
      const button = document.querySelector('#connect-button');
      const status = document.querySelector('#status');
      const statusTitle = document.querySelector('#status-title');
      const statusMessage = document.querySelector('#status-message');
      const appVersion = document.querySelector('#app-version');
      const websiteButton = document.querySelector('#website-button');

      const CONNECTION_ERROR_COPY = {
        'server-not-found': {
          title: 'Server address not found',
          message: 'Check that the URL is correct and that you are connected to the internet.',
        },
        offline: {
          title: 'You appear to be offline',
          message: 'Reconnect to the internet, then try connecting again.',
        },
        'server-unavailable': {
          title: 'Server is not available',
          message: 'The server is not accepting connections right now. Check that it is running, then try again.',
        },
        'connection-timed-out': {
          title: 'Connection timed out',
          message: 'The server took too long to respond. Check your network connection and try again.',
        },
        'certificate-error': {
          title: 'Secure connection could not be verified',
          message: 'Check the server address and its security certificate before trying again.',
        },
        'server-response-error': {
          title: 'Canvas Notebook is not ready at this address',
          message: 'The address responded, but the Canvas Notebook health check did not succeed. Confirm the URL and server health, then try again.',
        },
        'server-unreachable': {
          title: 'Could not reach the server',
          message: 'Check the server address, your internet connection, and that the server is running.',
        },
        'connection-failed': {
          title: 'Could not connect to the server',
          message: 'Check the server address and connection, then try again.',
        },
      };

      function setStatus(message, type = '', title = '') {
        status.hidden = !message;
        status.className = `status ${type}`.trim();
        statusTitle.textContent = title;
        statusMessage.textContent = message;
      }

      function showConnectionError(reason, fallbackMessage = '') {
        if (reason === 'invalid-url') {
          setStatus(fallbackMessage || 'Enter a complete server address, such as https://notebook.example.com.', 'error', 'Check the server URL');
          return;
        }

        const copy = CONNECTION_ERROR_COPY[reason] || CONNECTION_ERROR_COPY['connection-failed'];
        setStatus(copy.message, 'error', copy.title);
      }

      function setBusy(busy) {
        button.disabled = busy;
        input.disabled = busy;
        button.textContent = busy ? 'Connecting...' : 'Connect';
      }

      async function boot() {
        if (!window.canvasDesktop) {
          setStatus('Restart Canvas Notebook and try again. If this keeps happening, reinstall the desktop app.', 'error', 'The desktop connection is unavailable');
          return;
        }

        const info = await window.canvasDesktop.getAppInfo();
        const params = new URLSearchParams(window.location.search);
        const connectionError = params.get('connectionError');

        appVersion.textContent = `${info.appName} ${info.version}`;

        if (info.serverUrl) {
          input.value = info.serverUrl;
        }

        if (connectionError) {
          showConnectionError(connectionError);
        }
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const value = input.value.trim();

        setBusy(true);
        setStatus('We are checking the server address and its health.', 'progress', 'Connecting…');

        try {
          const result = await window.canvasDesktop.setServerUrl(value);

          if (!result.ok) {
            showConnectionError(result.reason, result.message);
            return;
          }

          const warning = result.warning ? `${result.warning} ` : '';
          setStatus(`${warning}Your server is ready. Opening it now…`, result.warning ? 'warning' : 'success', result.warning ? 'Connection note' : 'Connected');
        } catch (error) {
          showConnectionError('connection-failed');
        } finally {
          setBusy(false);
        }
      });

      input.addEventListener('input', () => {
        if (status.classList.contains('error')) {
          setStatus('');
        }
      });

      websiteButton.addEventListener('click', async () => {
        try {
          await window.canvasDesktop.openExternal('https://canvasnotebook.app');
        } catch {
          setStatus('We could not open the website. Please try again in your browser.', 'error', 'Website unavailable');
        }
      });

      boot().catch(error => {
        setStatus('Restart Canvas Notebook and try again. If this keeps happening, reinstall the desktop app.', 'error', 'Setup could not start');
      });
    </script>
  </body>
</html>
