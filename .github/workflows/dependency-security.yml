name: Dependency security

on:
  pull_request:
    paths:
      - 'package*.json'
      - 'requirements/**'
      - 'docs/compliance/**'
      - '.github/workflows/dependency-security.yml'
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'requirements/**'
      - 'docs/compliance/**'
      - '.github/workflows/dependency-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run test:licenses

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        architecture: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.10.1
      - name: Resolve and verify both complete binary locks
        run: >-
          python -m pip download --dest /tmp/security-wheels
          --platform manylinux_2_28_${{ matrix.architecture }}
          --platform manylinux2014_${{ matrix.architecture }}
          --platform manylinux_2_17_${{ matrix.architecture }}
          --python-version 3.11 --abi cp311 --implementation cp
          --only-binary=:all: --require-hashes
          -r requirements/runtime-python.txt -r requirements/dictation-python.txt
      - name: Audit every pinned package
        run: >-
          pip-audit --no-deps --disable-pip
          -r requirements/runtime-python.txt -r requirements/dictation-python.txt
