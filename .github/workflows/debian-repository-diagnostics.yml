name: Frozen Debian HTTP cache diagnostics
on:
  push:
    branches:
      - codex/diagnose-debian-snapshot
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d54eac4695c6cb394a405395506a0f3b513e96e9
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26
      - name: Compare default, revalidation and frozen-cache headers; reads only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import{createHash}from'node:crypto';
          const lock=JSON.parse(fs.readFileSync('docs/compliance/debian-repository-lock.json'));
          const modes=[['default',undefined],['force-revalidate','max-age=0'],['allow-frozen-cache','max-age=86400']];
          await Promise.all(lock.repositories.map(async repository=>{
           const url=repository.uri+'/dists/'+repository.suite+'/InRelease';
           for(const[mode,cache]of modes){const started=Date.now();try{const response=await fetch(url,{headers:cache?{'cache-control':cache}:{},signal:AbortSignal.timeout(20000)});const bytes=Buffer.from(await response.arrayBuffer());if(bytes.length>2*1024*1024)throw Error('Metadata bound');console.log(JSON.stringify({mode,url,status:response.status,finalUrl:response.url,sha256:createHash('sha256').update(bytes).digest('hex'),bytes:bytes.length,age:response.headers.get('age'),cache:response.headers.get('x-cache'),via:response.headers.get('via'),elapsedMs:Date.now()-started}));}catch(error){console.log(JSON.stringify({mode,url,error:error.message,elapsedMs:Date.now()-started}));}}
          }));
          NODE
