name: Dev Runtime Safety

on:
  pull_request:
    paths:
      - scripts/run-dev.mjs
      - scripts/dev-checkout-lifetime*.mjs
      - scripts/*shutdown*test.ts
      - scripts/browser-test-environment-test.ts
      - scripts/managed-test-context-contract-test.ts
      - scripts/playwright-suite-discovery-test.mjs
      - tests/helpers/browser-fixture-url.ts
      - tests/helpers/managed-test-workspace.ts
      - tests/helpers/managed-test-context.ts
      - tests/helpers/managed-acceptance-suites.mjs
      - tests/browser-lab.spec.ts
      - tests/collaboration-release-recovery.spec.ts
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/dev-runtime.yml
  push:
    branches: [main]
    paths:
      - scripts/run-dev.mjs
      - scripts/dev-checkout-lifetime*.mjs
      - scripts/*shutdown*test.ts
      - scripts/browser-test-environment-test.ts
      - scripts/managed-test-context-contract-test.ts
      - scripts/playwright-suite-discovery-test.mjs
      - tests/helpers/browser-fixture-url.ts
      - tests/helpers/managed-test-workspace.ts
      - tests/helpers/managed-test-context.ts
      - tests/helpers/managed-acceptance-suites.mjs
      - tests/browser-lab.spec.ts
      - tests/collaboration-release-recovery.spec.ts
      - playwright.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/dev-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run test:server:shutdown
      - run: npm run test:browser:environment
      - run: npx --no-install eslint scripts/run-dev.mjs scripts/dev-checkout-lifetime.mjs scripts/dev-checkout-lifetime-test.mjs
