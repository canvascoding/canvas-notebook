name: Electron Desktop Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing calendar release tag to rebuild
        type: string
        required: false
      source_sha:
        description: Full approved commit SHA, required with release_tag
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/electron-build.yml
      - .github/tests/electron-release-workflow.test.mjs

permissions:
  contents: read

concurrency:
  group: electron-desktop-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: node --test .github/tests/electron-release-workflow.test.mjs

  desktop:
    name: Build ${{ matrix.platform }}
    if: github.event_name != 'pull_request'
    needs: workflow-contract
    runs-on: ${{ matrix.os }}
    outputs:
      source_sha: ${{ steps.source.outputs.commit_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Verify desktop release source
        id: source
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == canvascoding/canvas-notebook ]] || exit 1
          task_sha="$(git rev-parse HEAD)"
          [[ "$task_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          task_tag="${REQUESTED_RELEASE_TAG:-}"
          task_expected_sha="${REQUESTED_SOURCE_SHA:-}"
          if [[ -n "$task_tag" || -n "$task_expected_sha" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$task_tag" && "$task_expected_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
            [[ "$task_sha" == "$task_expected_sha" ]] || exit 1
          else
            [[ "$task_sha" == "$GITHUB_SHA" ]] || exit 1
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              task_tag="${GITHUB_REF#refs/tags/}"
            fi
          fi
          if [[ -n "$task_tag" ]]; then
            [[ "$task_tag" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}\.[1-9][0-9]*$ ]] || exit 1
            [[ "$(git rev-parse "refs/tags/$task_tag^{commit}")" == "$task_sha" ]] || exit 1
            git merge-base --is-ancestor "$task_sha" refs/remotes/origin/main || exit 1
            [[ "$task_tag" == "v$(node -p "require('./package.json').version")" ]] || exit 1
          fi
          printf 'commit_sha=%s\nrelease_tag=%s\n' "$task_sha" "$task_tag" >> "$GITHUB_OUTPUT"
          printf '{"schemaVersion":1,"commitSha":"%s","tag":"%s"}\n' "$task_sha" "$task_tag" > desktop-release-source.json

      - name: Prepare macOS signing credentials
        if: matrix.platform == 'macos'
        shell: bash
        env:
          SIGNING_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGNING_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          append_env() {
            local name="$1"
            local value="$2"
            local delimiter="CANVAS_${name}_${RANDOM}_${RANDOM}"
            {
              echo "${name}<<${delimiter}"
              printf '%s\n' "$value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }

          missing=()
          [[ -n "${SIGNING_CSC_LINK:-}" ]] || missing+=("CSC_LINK")
          [[ -n "${SIGNING_CSC_KEY_PASSWORD:-}" ]] || missing+=("CSC_KEY_PASSWORD")

          has_api_key=false
          if [[ -n "${NOTARY_API_KEY_ID:-}" && -n "${NOTARY_API_ISSUER:-}" ]] && { [[ -n "${NOTARY_API_KEY_CONTENT:-}" ]] || [[ -n "${NOTARY_API_KEY_BASE64:-}" ]]; }; then
            has_api_key=true
          fi

          has_apple_id=false
          if [[ -n "${NOTARY_APPLE_ID:-}" && -n "${NOTARY_APP_SPECIFIC_PASSWORD:-}" && -n "${NOTARY_TEAM_ID:-}" ]]; then
            has_apple_id=true
          fi

          if [[ "$has_api_key" != "true" && "$has_apple_id" != "true" ]]; then
            missing+=("APPLE_API_KEY or APPLE_API_KEY_BASE64 with APPLE_API_KEY_ID and APPLE_API_ISSUER, or APPLE_ID with APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID")
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub secret(s) required for macOS Developer ID signing and notarization:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

          append_env "CSC_LINK" "$SIGNING_CSC_LINK"
          append_env "CSC_KEY_PASSWORD" "$SIGNING_CSC_KEY_PASSWORD"

          if [[ "$has_api_key" == "true" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${NOTARY_API_KEY_ID}.p8"
            if [[ -n "${NOTARY_API_KEY_BASE64:-}" ]]; then
              printf '%s' "$NOTARY_API_KEY_BASE64" | base64 -D > "$key_path"
            else
              printf '%s\n' "$NOTARY_API_KEY_CONTENT" > "$key_path"
            fi
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
            append_env "APPLE_API_KEY_ID" "$NOTARY_API_KEY_ID"
            append_env "APPLE_API_ISSUER" "$NOTARY_API_ISSUER"
          else
            append_env "APPLE_ID" "$NOTARY_APPLE_ID"
            append_env "APPLE_APP_SPECIFIC_PASSWORD" "$NOTARY_APP_SPECIFIC_PASSWORD"
            append_env "APPLE_TEAM_ID" "$NOTARY_TEAM_ID"
          fi

          echo "macOS signing credentials are configured."

      - name: Install dependencies
        run: npm ci

      - name: Verify release compliance
        run: npm run test:licenses:release

      - name: Build Electron desktop artifacts
        shell: bash
        run: |
          npm run electron:package

      - name: Verify macOS signing and packaged permissions
        id: signed-app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(/usr/bin/find dist-electron -type d -name 'Canvas Notebook.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No packaged macOS app bundle found under dist-electron." >&2
            exit 1
          fi

          app_path="$(cd "$(dirname "$app_path")" && printf '%s/%s' "$(pwd -P)" "$(basename "$app_path")")"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          CANVAS_ELECTRON_MAC_TEST_BUNDLE="$app_path" node --test electron/main/microphone-packaging.test.mjs
          printf 'app_path=%s\n' "$app_path" >> "$GITHUB_OUTPUT"

      - name: Verify Apple notarization ticket
        if: matrix.platform == 'macos'
        timeout-minutes: 5
        shell: bash
        env:
          APP_PATH: ${{ steps.signed-app.outputs.app_path }}
        run: |
          set -euo pipefail
          umask 077
          task_log="$(mktemp "$RUNNER_TEMP/canvas-notary-validation.XXXXXX")"
          trap 'rm -f "$task_log"' EXIT
          for task_attempt in 1 2 3 4; do
            if xcrun stapler validate "$APP_PATH" > "$task_log" 2>&1; then
              cat "$task_log"
              exit 0
            else
              task_status=$?
            fi
            cat "$task_log"
            if (( task_status != 68 || task_attempt == 4 )); then
              exit "$task_status"
            fi
            if ! grep -Eq 'NSURLErrorDomain Code=-(1001|1003|1004|1005|1009)([[:space:]]|$)' "$task_log"; then
              exit "$task_status"
            fi
            task_delay=$((task_attempt * 15))
            printf 'Apple ticket lookup transport failure; retry %s/4 in %ss.\n' "$((task_attempt + 1))" "$task_delay"
            sleep "$task_delay"
          done

      - name: Assess macOS Gatekeeper policy
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APP_PATH: ${{ steps.signed-app.outputs.app_path }}
        run: spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Stage desktop source receipt
        shell: bash
        run: |
          set -euo pipefail
          mv desktop-release-source.json dist-electron/desktop-release-source.json

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: canvas-notebook-desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist-electron/*.blockmap
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/latest-mac.yml
            dist-electron/desktop-release-source.json

  release:
    name: Publish desktop release
    if: needs.desktop.outputs.release_tag != ''
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.desktop.outputs.release_tag }}
      RELEASE_SOURCE_SHA: ${{ needs.desktop.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.desktop.outputs.source_sha }}

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: canvas-notebook-desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify updater manifest asset references
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(git rev-parse HEAD)" == "$RELEASE_SOURCE_SHA" ]]
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('release-artifacts/desktop-release-source.json', 'utf8'));
          assert.equal(source.schemaVersion, 1);
          assert.equal(source.commitSha, process.env.RELEASE_SOURCE_SHA);
          assert.equal(source.tag, process.env.RELEASE_TAG);
          NODE
          node scripts/sync-electron-version.mjs
          expected_version="$(node -p "require('./electron/package.json').version")"
          manifest_version="$(awk '/^version: / { print $2; exit }' release-artifacts/latest-mac.yml)"
          [[ "$manifest_version" == "$expected_version" ]]

          manifest_files=0
          while IFS= read -r asset; do
            [[ -n "$asset" ]]
            [[ -f "release-artifacts/$asset" ]]
            manifest_files=$((manifest_files + 1))
          done < <(awk '/^  - url: / { print $3 }' release-artifacts/latest-mac.yml)

          (( manifest_files > 0 ))

      - name: Upload desktop artifacts to the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release-artifacts/*.blockmap
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/latest-mac.yml
          )

          if (( ${#files[@]} == 0 )); then
            echo "No desktop artifacts found for release upload."
            exit 1
          fi

          for _ in {1..120}; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 15
          done
          gh release view "$RELEASE_TAG" >/dev/null

          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
