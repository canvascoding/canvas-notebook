<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="bradley-generating-title bradley-generating-desc">
  <title id="bradley-generating-title">Bradley arbeitet</title>
  <desc id="bradley-generating-desc">Der blaue gefaltete Canvas-Charakter bewegt sich ruhig, während nacheinander drei Faltflächen aufleuchten.</desc>
  <style>
    .bradley-character {
      animation: bradley-hover 2.4s cubic-bezier(.4, 0, .2, 1) infinite;
      transform-box: view-box;
      transform-origin: 32px 36px;
      will-change: transform;
    }

    .bradley-raised-fold {
      animation: bradley-fold 2.4s cubic-bezier(.4, 0, .2, 1) infinite;
      transform-box: view-box;
      transform-origin: 40px 33px;
      will-change: transform;
    }

    .bradley-scan {
      animation: bradley-scan 2.4s ease-in-out infinite;
      opacity: 0;
      will-change: opacity;
    }

    .bradley-scan-b { animation-delay: .28s; }
    .bradley-scan-c { animation-delay: .56s; }

    .bradley-activity-bar {
      animation: bradley-activity 1.2s ease-in-out infinite;
      opacity: .45;
      will-change: opacity;
    }

    .bradley-activity-b { animation-delay: .16s; }
    .bradley-activity-c { animation-delay: .32s; }

    @keyframes bradley-hover {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-1.15px) scale(1.008); }
    }

    @keyframes bradley-fold {
      0%, 18%, 72%, 100% { transform: rotate(0deg) translateY(0); }
      42% { transform: rotate(-2.4deg) translateY(-.35px); }
    }

    @keyframes bradley-scan {
      0%, 10%, 42%, 100% { opacity: 0; }
      23% { opacity: .22; }
    }

    @keyframes bradley-activity {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bradley-character,
      .bradley-raised-fold,
      .bradley-scan,
      .bradley-activity-bar {
        animation: none !important;
        transform: none !important;
      }

      .bradley-scan { opacity: 0; }
      .bradley-activity-bar { opacity: 1; }
    }
  </style>

  <g class="bradley-character">
    <!-- Rear fold and right foot. -->
    <path d="M35.5 31.5 55.7 31.1c2.1 0 3.8 1.8 3.6 3.9l-1.8 20.7a3.4 3.4 0 0 1-3.6 3.1l-10.7-.6-10.6-8.5Z" fill="#1469D3" />

    <!-- Main folded canvas body. -->
    <path d="M15.3 8.9 48.1 4.4a3.6 3.6 0 0 1 4 3l4 26.2-13 12.8-13.9 12.9H11.4a3.5 3.5 0 0 1-3.5-3.8l2.7-38.8a8.5 8.5 0 0 1 4.7-7.8Z" fill="#2F8CFF" />

    <!-- Left and lower fold planes. -->
    <path d="m15.3 8.9-4.7 7.8-2.7 38.8a3.5 3.5 0 0 0 3.5 3.8h3.1l2.4-43.7Z" fill="#63B1FF" />
    <path d="m8 55.5 35.1-9.1-13.9 12.9H11.4A3.5 3.5 0 0 1 8 55.5Z" fill="#1876E4" />

    <!-- Raised right fold. -->
    <g class="bradley-raised-fold">
      <path d="m41.4 27.1 14.1 5.1a5.8 5.8 0 0 1 3.8 6.1l-1.2 11.1-12.7-5.6-8.3-9.8 2.2-5.5a1.8 1.8 0 0 1 2.1-1.4Z" fill="#4DA3FF" />
      <path d="m39.3 28.5-2.2 5.5 7.1 2.7-2.8-9.6a1.8 1.8 0 0 0-2.1 1.4Z" fill="#79BCFF" />
      <path class="bradley-scan bradley-scan-c" d="m41.4 27.1 14.1 5.1a5.8 5.8 0 0 1 3.8 6.1l-1.2 11.1-12.7-5.6-8.3-9.8 2.2-5.5a1.8 1.8 0 0 1 2.1-1.4Z" fill="#fff" />
    </g>

    <!-- A restrained light pass across the existing fold planes. -->
    <path class="bradley-scan bradley-scan-a" d="m15.3 8.9-4.7 7.8-2.7 38.8a3.5 3.5 0 0 0 3.5 3.8h3.1l2.4-43.7Z" fill="#fff" />
    <path class="bradley-scan bradley-scan-b" d="m8 55.5 35.1-9.1-13.9 12.9H11.4A3.5 3.5 0 0 1 8 55.5Z" fill="#fff" />

    <!-- Eyes remain static so the motion reads as system state, not facial acting. -->
    <g fill="#172033">
      <circle cx="27.1" cy="22.1" r="2.6" />
      <circle cx="39.4" cy="20.4" r="2.6" />
    </g>
  </g>

  <!-- A non-anatomical activity badge remains legible when motion is reduced. -->
  <g aria-hidden="true">
    <rect x="44.5" y="43" width="15" height="15" rx="2.5" fill="#172033" />
    <rect class="bradley-activity-bar bradley-activity-a" x="48" y="49" width="1.8" height="5" rx=".9" fill="#fff" />
    <rect class="bradley-activity-bar bradley-activity-b" x="51.2" y="47" width="1.8" height="7" rx=".9" fill="#fff" />
    <rect class="bradley-activity-bar bradley-activity-c" x="54.4" y="45" width="1.8" height="9" rx=".9" fill="#fff" />
  </g>
</svg>
